name: morning-briefing
on:
  schedule: [{ cron: '45 9 * * *' }]   # 06:45 America/Sao_Paulo
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: skip if an edition already went out this morning (09:00 UTC onwards)
        id: dedupe
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          since="$(date -u +%Y-%m-%d)T09:00:00Z"
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/brief.yml/runs?status=success&created=>=$since&per_page=5" --jq '.total_count')
          echo "already_sent=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "successful runs since $since: ${n:-0}"
      - uses: actions/checkout@v4
        if: steps.dedupe.outputs.already_sent != 'true'
      - uses: actions/setup-node@v4
        if: steps.dedupe.outputs.already_sent != 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.dedupe.outputs.already_sent != 'true'
      - name: Resolve photos for today's destinations
        if: steps.dedupe.outputs.already_sent != 'true'
        run: node -e "const P=require('./src/plan.js'),F=require('./src/flights.js');const st=require('./data/state.json');const d=new Intl.DateTimeFormat('en-CA',{timeZone:st.tz}).format(new Date());const p=P.planFor(st,d);const at=(st.tour&&st.tour.at)||'HND';const it=F.itinerary(at,p.blocks.filter(b=>['sprint','retrieval'].includes(b.kind)));const names=[...new Set([...it.legs.filter(l=>l.flight).map(l=>l.flight.city),F.BY[it.endsAt]?F.BY[it.endsAt].c:'','Stanford','Artificial intelligence'])].filter(Boolean);require('child_process').execFileSync('node',['scripts/images.js',...names],{stdio:'inherit'})"
      - run: node scripts/news.js
        if: steps.dedupe.outputs.already_sent != 'true'
      - run: node scripts/send-brief.js
        if: steps.dedupe.outputs.already_sent != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: Life
