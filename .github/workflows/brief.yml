name: morning-briefing
on:
  schedule: [{ cron: '45 9 * * *' }]   # 06:45 America/Sao_Paulo
  workflow_dispatch:
    inputs:
      force: { description: 'send even if an edition already went out today', type: boolean, default: false }
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: skip if an edition already went out this morning (09:00 UTC onwards)
        id: dedupe
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          since="$(date -u +%Y-%m-%d)T09:00:00Z"
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/brief.yml/runs?status=success&created=>=$since&per_page=5" --jq '.total_count')
          if [ "${{ github.event.inputs.force }}" = "true" ]; then n=0; fi
          echo "already_sent=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "successful runs since $since: ${n:-0}"
      - uses: actions/checkout@v4
        if: steps.dedupe.outputs.already_sent != 'true'
      - uses: actions/setup-node@v4
        if: steps.dedupe.outputs.already_sent != 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.dedupe.outputs.already_sent != 'true'
      - name: Resolve photos for today's destinations
        if: steps.dedupe.outputs.already_sent != 'true'
        run: node scripts/photo-names.js | tr '\n' '\0' | xargs -0 node scripts/images.js
      - run: node scripts/news.js
        if: steps.dedupe.outputs.already_sent != 'true'
      - run: node scripts/send-brief.js
        if: steps.dedupe.outputs.already_sent != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: Life
