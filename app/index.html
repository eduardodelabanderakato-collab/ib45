<style>
:root{
  --ground:#F3F5F8;--ground2:#E9EDF2;--glass:rgba(255,255,255,.66);--glass2:rgba(255,255,255,.45);--line:rgba(16,19,24,.08);--ink:#101318;--dim:rgba(16,19,24,.52);--faint:rgba(16,19,24,.3);
  --accent:#8C1515;--accent-ink:#fff;--ok:#1F7A4D;--warn:#B4540A;--bad:#B3261E;
  --orb1:#D7DFE9;--orb2:#E3E8EE;--orb3:#DCE3EA;--shadow:0 10px 30px rgba(20,30,50,.07);--r:22px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;--display:"Inter Tight","Inter",-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#0F1216;--ground2:#151A20;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.045);--line:rgba(242,244,247,.09);--ink:#F2F4F7;--dim:rgba(242,244,247,.55);--faint:rgba(242,244,247,.3);--accent:#D23B2E;--ok:#3FB37A;--warn:#E08A3C;--bad:#F06A5E;--orb1:#1B2433;--orb2:#1E1F2C;--orb3:#16252A;--shadow:0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--ground:#0F1216;--ground2:#151A20;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.045);--line:rgba(242,244,247,.09);--ink:#F2F4F7;--dim:rgba(242,244,247,.55);--faint:rgba(242,244,247,.3);--accent:#D23B2E;--ok:#3FB37A;--warn:#E08A3C;--bad:#F06A5E;--orb1:#1B2433;--orb2:#1E1F2C;--orb3:#16252A;--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,var(--ground) 0%,var(--ground2) 100%);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0}.orbs i{position:absolute;border-radius:50%;filter:blur(80px)}
.orbs i:nth-child(1){left:-25%;top:-10%;width:70%;height:45%;background:var(--orb1)}.orbs i:nth-child(2){right:-25%;top:35%;width:70%;height:50%;background:var(--orb2)}.orbs i:nth-child(3){left:15%;bottom:-25%;width:80%;height:45%;background:var(--orb3)}
.app{position:relative;z-index:1;min-height:100%;display:grid;grid-template-columns:232px 1fr}
nav.rail{position:sticky;top:0;height:100vh;padding:22px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.02em;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.02em}.brand small{color:var(--dim);font-size:12px;font-weight:500}
.tab{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--dim);font-weight:500;cursor:pointer;border:0;background:transparent;font:inherit;text-align:left;width:100%}
.tab svg{width:20px;height:20px;flex:0 0 auto}.tab.on{background:var(--glass);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.railfoot{margin-top:auto;font-size:12px;color:var(--dim);padding:8px}
main{padding:26px 28px 40px;max-width:1100px;width:100%}
.view{display:none}.view.on{display:block}
h1{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.035em;margin:0;line-height:1.05;text-wrap:balance}
.sub{color:var(--dim);font-weight:500;margin-top:6px;font-size:14px}
h2{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px 4px}
.g{position:relative;background:var(--glass);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.1),var(--shadow);border:1px solid rgba(255,255,255,.5)}
:root[data-theme="dark"] .g,:root:not([data-theme="light"]) .g{border-color:var(--line)}
.card{padding:18px 20px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
/* blocks */
.blk{padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:start;cursor:pointer}
.blk .t{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.025em;line-height:1.1}
.blk.now .t{font-size:28px;letter-spacing:-.03em}
.blk .m{color:var(--dim);font-size:13px;font-weight:500;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.pill.acc{background:var(--accent);color:var(--accent-ink);border-color:transparent}.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.blk .side{text-align:right;color:var(--dim);font-size:12.5px;font-weight:500;white-space:nowrap}
.steps{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.step{display:flex;align-items:center;gap:11px;font-weight:500;cursor:pointer;user-select:none;padding:4px 0}
.ck{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--faint);flex:0 0 auto;display:grid;place-items:center;transition:background .15s,border-color .15s}
.step.done .ck{background:var(--accent);border-color:var(--accent)}.step.done .ck:after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.step.done span{opacity:.45;text-decoration:line-through}
.btn{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 6px 18px rgba(140,21,21,.25)}.btn:disabled{opacity:.45;cursor:default;box-shadow:none}.btn.ghost{background:var(--glass2);color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.flight{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.flight b{font-weight:500;color:var(--accent)}
/* countdown */
.cd{display:flex;align-items:center;gap:14px;padding:12px 16px}.cd .big{font-family:var(--display);font-weight:500;font-size:34px;letter-spacing:-.04em;line-height:1;min-width:44px}.cd .lbl{display:flex;flex-direction:column;font-size:13px;line-height:1.3}.cd .lbl b{font-weight:600}.cd .lbl span{color:var(--dim);font-size:12.5px}
.cd.urgent .big{color:var(--accent)}
/* stats */
.stat{padding:14px 16px}.stat .big{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:-.04em;line-height:1}.stat .big small{font-size:14px;color:var(--dim);letter-spacing:0}.stat .lbl{color:var(--dim);font-size:12.5px;margin-top:4px}
/* banner */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-radius:16px;background:var(--accent);color:#fff;font-weight:600;margin-bottom:16px}
.banner .btn{background:#fff;color:var(--accent);box-shadow:none;padding:9px 14px}
/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--dim)}.form label.full{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}textarea{min-height:76px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{font:inherit;font-weight:600;font-size:13px;border:0;background:transparent;color:var(--dim);padding:7px 12px;border-radius:9px;cursor:pointer}.seg button.on{background:var(--ink);color:var(--ground)}
/* subjects */
.subj{padding:16px 18px;display:grid;gap:8px;cursor:pointer;border-top:4px solid var(--c)}
.subj .name{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:baseline}
.grade{font-family:var(--mono);font-size:13px;color:var(--dim)}.grade b{color:var(--ink);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;background:var(--c)}
.subj small{color:var(--dim);font-size:12.5px;line-height:1.35}
/* milestones */
.ms{display:grid;grid-template-columns:20px 74px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.ms:first-child{border-top:0}.ms .d{font-family:var(--mono);font-size:12px;color:var(--dim)}.ms.done span.t{opacity:.45;text-decoration:line-through}.ms .cat{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.emblem{display:flex;align-items:center;gap:16px}.emblem .seal{width:64px;height:64px;border-radius:18px;background:var(--accent);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.04em;box-shadow:0 10px 24px rgba(140,21,21,.3)}
.emblem h1{font-size:34px}.emblem .sub{margin-top:2px}
#map{height:380px;border-radius:var(--r);overflow:hidden}
.legs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ledger{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}.ledger .k{color:var(--dim)}
.muted{color:var(--dim)}.small{font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}.toast.on{opacity:1}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}nav.rail{display:none}main{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .grid2,.grid3{grid-template-columns:1fr}.form{grid-template-columns:1fr}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--glass);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:6px;box-shadow:var(--shadow);justify-content:space-around}
  .tabbar .tab{flex-direction:column;gap:3px;font-size:10.5px;padding:8px 4px;border-radius:14px;width:auto;flex:1;align-items:center}
  .blk.now .t{font-size:24px}h1{font-size:26px}.emblem h1{font-size:28px}
  .ms{grid-template-columns:20px 1fr;grid-template-areas:"ck t" "ck meta";gap:4px 10px}.ms .t{grid-area:t}.ms .d{grid-area:meta}.ms .cat{grid-area:meta;justify-self:end}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const TABS = [['deck','Deck'],['tour','Tour'],['subjects','Subjects'],['stanford','Stanford'],['contract','Contract']];
const $ = s => document.querySelector(s); const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const addDays = (iso, n) => { const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const toMin = t => (+t.slice(0,2))*60 + (+t.slice(3));
const daysBetween = (a,b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/86400000);
const pretty = iso => new Date(iso+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

// ---------- state ----------
const S = { date: todayISO(), plan: null, day: null, audit: null, subjects: SEED.subjects, assessments: SEED.assessments, tour: SEED.tour, stanford: SEED.stanford, stanfordDone: {}, contract: null, errors: [], week: [], db: null, uid: null, canWrite: null, view: (location.hash||'#deck').slice(1) };
S.plan = (SEED.plans||{})[S.date] || null;
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800); }

// ---------- nav ----------
function renderNav(){
  const av = APP.avatar ? `<img src="${APP.avatar}" alt="">` : APP.initials;
  $('#rail').innerHTML = `<div class="brand"><div class="avatar">${av}</div><div><b>${esc(APP.name)}</b><small>${esc(APP.student)} · ${esc(APP.classOf)}</small></div></div>` +
    TABS.map(([k,l])=>`<button class="tab ${S.view===k?'on':''}" data-v="${k}">${ICONS[k]}<span>${l}</span></button>`).join('') +
    `<div class="railfoot" id="railfoot"></div>`;
  $('#tabbar').innerHTML = TABS.map(([k,l])=>`<button class="tab ${S.view===k?'on':''}" data-v="${k}">${ICONS[k]}<span>${l}</span></button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ S.view=b.dataset.v; location.hash='#'+S.view; renderAll(); window.scrollTo({top:0}); }));
}
window.addEventListener('hashchange',()=>{ S.view=(location.hash||'#deck').slice(1); renderAll(); });

// ---------- deck ----------
function blockStatus(b){
  const d = S.day||{}; const started = d.started && d.started[b.slot]; const ticks = (d.steps||{}); const total = (b.steps||[]).length; const done = (b.steps||[]).filter((_,i)=>ticks[b.slot+'|'+i]).length;
  const nm = nowMin(); const cur = nm >= toMin(b.start) && nm < toMin(b.end); const past = nm >= toMin(b.end);
  const flownAudit = (S.audit && S.audit.flown && S.audit.flown[b.slot]);
  return { started: !!started || !!flownAudit, done, total, complete: total>0 && done===total, cur, past };
}
function firstOpenBlock(){ const bl=(S.plan?.blocks||[]).filter(b=>b.kind!=='fixed'); return bl.find(b=>{const s=blockStatus(b); return !s.complete && !s.past;}) || bl.find(b=>!blockStatus(b).complete) || bl[0]; }
function renderDeck(){
  const v=$('#v-deck'); if(!S.plan){ v.innerHTML=`<h1>${esc(APP.name)}</h1><div class="sub">No plan for ${pretty(S.date)} yet. Tell Claude.</div>`; return; }
  const p=S.plan; const open=firstOpenBlock(); const wk=weekRates(); const nm=nowMin();
  const reportDue = nm >= 21*60+10 && !(S.day&&S.day.report);
  const cds=(p.countdowns||[]).filter(c=>c.type!=='checkpoint').slice(0,4);
  const blocks=p.blocks.map(b=>{
    if(b.kind==='fixed') return `<div class="g blk" style="cursor:default;padding:11px 20px"><div><div class="t" style="font-size:15px;color:var(--dim)">${esc(b.title)}</div></div><div class="side">${b.start} – ${b.end}</div></div>`;
    const s=blockStatus(b); const isOpen = open && open.slot===b.slot; const expanded = isOpen || (S.day?.expanded||{})[b.slot];
    const status = s.complete?`<span class="pill ok">Landed</span>`: s.started?`<span class="pill acc">In the air</span>`: s.cur?`<span class="pill warn">Now</span>`: s.past?`<span class="pill bad">Missed</span>`:'';
    const fl = b.flight?`<span class="flight">${esc(b.flight.from)} <b>→</b> ${esc(b.flight.to)} · ${esc(b.flight.city)} · ${b.flight.minutes} min</span>`:'';
    const steps = expanded?`<div class="steps">${(b.steps||[]).map((st,i)=>`<div class="step ${(S.day?.steps||{})[b.slot+'|'+i]?'done':''}" data-k="${b.slot}|${i}"><span class="ck"></span><span>${esc(st)}</span></div>`).join('')}</div>
      <div class="actions">${!s.started?`<button class="btn" data-start="${b.slot}">Take off</button>`:''}${s.started&&!s.complete?`<span class="muted small">Tick every step to land.</span>`:''}${s.complete?`<span class="pill ok">Flight logged</span>`:''}</div>`:'';
    return `<div class="g blk ${isOpen?'now':''}" data-toggle="${b.slot}"><div><div class="t">${esc(b.title)}</div><div class="m"><span>${b.start} – ${b.end}</span><span>${esc(b.subjectShort||'')}${b.where?' · '+esc(b.where):''}</span>${fl}</div></div><div class="side">${status}<div style="margin-top:6px">${s.done}/${s.total}</div></div>${steps}</div>`;
  }).join('');
  const closeBtn = (S.day&&S.day.report) ? `<span class="pill ok">Day closed · ${S.day.report.sprintsDone}/${S.day.report.sprintsPlanned} flown</span>` : `<button class="btn ghost" id="closeDay">Close the day</button>`;
  v.innerHTML = `${reportDue?`<div class="banner"><span>The day is still open. Report before lights out.</span><button class="btn" id="bannerReport">Report now</button></div>`:''}
  <h1>${esc(p.label)} <span class="muted" style="font-weight:500">· ${esc(p.dayLabel)}</span></h1>
  <div class="sub">${esc(p.phase)} · in <span class="mono">${esc(S.tour?.at||p.at)}</span> · started ${wk.daysStarted} of ${wk.schoolDaysSoFar} this week</div>
  <div class="grid2" style="margin-top:18px"><div><h2 style="margin-top:0">Today</h2><div class="stack" id="blocks">${blocks}</div><div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${closeBtn}<span class="muted small">Closing without a report counts as a miss.</span></div><div id="reportPanel"></div></div>
  <div><h2 style="margin-top:0">Countdowns</h2><div class="stack">${cds.map(c=>`<div class="g cd ${c.daysLeft<=3?'urgent':''}"><div class="big">${c.daysLeft}</div><div class="lbl"><b>${esc(c.title)}</b><span>${c.daysLeft===0?'today':c.daysLeft===1?'tomorrow':pretty(c.date)}${c.task?' · '+esc(c.task.replace(/^\S+ (ramp|report) -\d+: /,'')):''}</span></div></div>`).join('')||'<div class="g card muted">No tests announced. Tell Claude the moment one is.</div>'}</div>
  <h2>This week</h2><div class="grid3" style="grid-template-columns:1fr 1fr"><div class="g stat"><div class="big">${wk.daysStarted}<small>/${wk.schoolDaysSoFar}</small></div><div class="lbl">days started</div></div><div class="g stat"><div class="big">${wk.blocksFlown}<small>/${wk.blocksPlanned}</small></div><div class="lbl">blocks flown</div></div><div class="g stat"><div class="big">${wk.minutes}</div><div class="lbl">minutes in the air</div></div><div class="g stat"><div class="big">${wk.errorsClosed}<small>/${wk.errorsAdded}</small></div><div class="lbl">errors closed / added</div></div></div>
  ${S.db===null && S.dbTried?`<div class="g card muted small" style="margin-top:14px">Sign in on claude.ai to keep what you tick and to report. Right now nothing is saved.</div>`:''}
  </div></div>`;
  v.querySelectorAll('.step').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); tickStep(el.dataset.k); }));
  v.querySelectorAll('[data-start]').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); takeOff(el.dataset.start); }));
  v.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',e=>{ if(e.target.closest('.step,button')) return; const ex=Object.assign({},S.day?.expanded||{}); ex[el.dataset.toggle]=!ex[el.dataset.toggle]; S.day=Object.assign({},S.day||{},{expanded:ex}); renderDeck(); }));
  const cb=$('#closeDay'); if(cb) cb.addEventListener('click',()=>renderReport()); const br=$('#bannerReport'); if(br) br.addEventListener('click',()=>{ renderReport(); $('#reportPanel').scrollIntoView({behavior:'smooth'}); });
}
function renderReport(){
  const p=S.plan; const planned=p.blocks.filter(b=>b.kind!=='fixed'); const done=planned.filter(b=>blockStatus(b).complete).length;
  $('#reportPanel').innerHTML=`<div class="g card" style="margin-top:12px"><div style="font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.02em;margin-bottom:10px">Close ${esc(pretty(S.date))}</div>
  <div class="form"><label>Blocks flown<input id="rSprints" type="number" min="0" max="${planned.length}" value="${done}"></label><label>Planned<input type="number" value="${planned.length}" disabled></label>
  <label>Errors added<input id="rAdded" type="number" min="0" value="0"></label><label>Errors closed<input id="rClosed" type="number" min="0" value="0"></label>
  <label class="full">Retrieval done?<div class="seg" id="rRet"><button data-v="1">Yes</button><button data-v="0" class="on">No</button></div></label>
  <label class="full">What did the plan get wrong? One line.<textarea id="rNote" placeholder="e.g. Pre-learn took 70 min, not 50. Econ questions were harder than expected."></textarea></label></div>
  <div class="actions" style="margin-top:12px"><button class="btn" id="rSubmit">Submit report</button><span class="muted small">Then Claude replies with tomorrow's first flight.</span></div></div>`;
  $('#rRet').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ $('#rRet').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }));
  $('#rSubmit').addEventListener('click',submitReport);
}
async function submitReport(){
  const planned=S.plan.blocks.filter(b=>b.kind!=='fixed').length;
  const report={ sprintsDone:+$('#rSprints').value||0, sprintsPlanned:planned, errorsAdded:+$('#rAdded').value||0, errorsClosed:+$('#rClosed').value||0, retrieval:$('#rRet .on').dataset.v==='1', note:$('#rNote').value.trim(), submittedAt:new Date().toISOString() };
  const started = Object.keys((S.day||{}).started||{}).length>0 || report.sprintsDone>0;
  await saveDay({ report, started, closedAt: report.submittedAt }); toast('Day closed'); renderDeck();
}
async function tickStep(k){ const steps=Object.assign({},S.day?.steps||{}); steps[k]=!steps[k]; const slot=k.split('|')[0]; const started=Object.assign({},S.day?.started||{}); if(!started[slot]) started[slot]=new Date().toISOString(); await saveDay({steps, started}); renderDeck(); }
async function takeOff(slot){ const started=Object.assign({},S.day?.started||{}); started[slot]=new Date().toISOString(); await saveDay({started}); toast('Wheels up. Fly it in Focus Flight.'); renderDeck(); }
async function saveDay(patch){
  S.day=Object.assign({}, S.day||{date:S.date}, patch); if(!S.day.date) S.day.date=S.date;
  if(S.db){ try{ const ref=S.db.doc('days/'+S.date); const {expanded, ...body}=S.day; await ref.set(body); }catch(e){ toast('Not saved: '+(e.code||'error')); } }
}
function weekRates(){
  const from=addDays(S.date,-6); const rows=S.week.filter(r=>r.date>=from && r.date<=S.date);
  const monday=addDays(S.date,-((new Date(S.date+'T12:00:00').getDay()+6)%7)); let schoolDaysSoFar=0; for(let d=monday; d<=S.date; d=addDays(d,1)){ const wd=new Date(d+'T12:00:00').getDay(); if(wd>=1&&wd<=5) schoolDaysSoFar++; }
  const wk=rows.filter(r=>r.date>=monday); const sum=(k)=>rows.reduce((a,r)=>a+((r.report&&r.report[k])||0),0);
  const flown=rows.reduce((a,r)=>a+((r.report&&r.report.sprintsDone)||Object.keys(r.started||{}).length),0);
  const planned=rows.reduce((a,r)=>a+((r.report&&r.report.sprintsPlanned)||0),0);
  const minutes=S.auditWeek.reduce((a,r)=>a+(r.focusMinutes||0),0);
  return { daysStarted: wk.filter(r=>r.started||Object.keys(r.started||{}).length>0).length, schoolDaysSoFar, blocksFlown:flown, blocksPlanned:planned, minutes, errorsAdded:sum('errorsAdded'), errorsClosed:sum('errorsClosed') };
}
S.auditWeek=[];

// ---------- tour ----------
let mapObj=null;
function renderTour(){
  const v=$('#v-tour'); const t=S.tour||{}; const co=t.coords||{}; const vis=(t.visited||[]).filter(c=>co[c]);
  const km=Math.round(t.kmTotal||0); const hrs=Math.round((t.minutesTotal||0)/60*10)/10; const nextWps=(t.waypoints||[]).slice((t.waypoints||[]).indexOf(t.at)+1, (t.waypoints||[]).indexOf(t.at)+6);
  v.innerHTML=`<h1>The World Tour</h1><div class="sub">Every study block is a flight. You are in <span class="mono">${esc(t.at)}</span> ${co[t.at]?'· '+esc(co[t.at].c):''}. Home is São Paulo. Trips repeat until May 2028.</div>
  <div class="g" id="map" style="margin-top:18px"></div>
  <div class="grid3" style="margin-top:14px"><div class="g stat"><div class="big">${km.toLocaleString()}<small> km</small></div><div class="lbl">flown since Sep 22</div></div><div class="g stat"><div class="big">${hrs}<small> h</small></div><div class="lbl">in the air</div></div><div class="g stat"><div class="big">${(t.cities||vis.length)}</div><div class="lbl">cities</div></div></div>
  <h2>Next waypoints</h2><div class="legs">${nextWps.map(w=>`<div class="g card"><div class="mono" style="color:var(--accent)">${w}</div><div style="font-weight:600;margin-top:2px">${esc(co[w]?co[w].c:w)}</div></div>`).join('')}</div>`;
  if(window.jsVectorMap){ try{ const markers=vis.map(c=>({name:c,coords:[co[c].la,co[c].lo]})); const lines=[]; for(let i=1;i<vis.length;i++) lines.push({from:vis[i-1],to:vis[i]});
    const dark=matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme!=='light' || document.documentElement.dataset.theme==='dark';
    mapObj=new jsVectorMap({selector:'#map',map:'world',zoomButtons:false,zoomOnScroll:false,backgroundColor:'transparent',regionStyle:{initial:{fill:dark?'#26303d':'#D9E0E8',stroke:dark?'#0F1216':'#F3F5F8',strokeWidth:.6}},markers,lines,markerStyle:{initial:{fill:'#8C1515',stroke:'#fff',strokeWidth:2,r:4},hover:{fill:'#8C1515'}},lineStyle:{stroke:'#8C1515',strokeWidth:1.6,strokeDasharray:'4 3'},labels:{markers:{render:m=>m.name}},markerLabelStyle:{initial:{fontFamily:'JetBrains Mono, monospace',fontSize:10,fill:dark?'#F2F4F7':'#101318'}}}); }catch(e){ $('#map').innerHTML='<div class="card muted">Map unavailable.</div>'; } }
}

// ---------- subjects ----------
function renderSubjects(){
  const v=$('#v-subjects'); const subs=(S.subjects?.subjects||[]); const tests=(S.assessments?.items||[]);
  const errBy=id=>S.errors.filter(e=>e.subject===id);
  v.innerHTML=`<h1>Subjects</h1><div class="sub">Six sevens. Readiness is topics taught; the error log is the health metric.</div>
  <div class="grid3" style="margin-top:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${subs.map(s=>{ const nt=tests.filter(t=>t.subject===s.id&&t.date>=S.date&&t.type!=='checkpoint').sort((a,b)=>a.date<b.date?-1:1)[0]; const dl=nt?daysBetween(S.date,nt.date):null; const er=errBy(s.id); const open=er.filter(e=>!e.closed).length;
    return `<div class="g subj" style="--c:${s.color}" data-s="${s.id}"><div class="name"><span>${esc(s.short)}</span><span class="grade">now <b>${s.grade??'–'}</b> → <b>7</b></span></div><div class="bar"><i style="width:${s.topicsTotal?Math.round(100*s.topicsTaught/s.topicsTotal):0}%"></i></div><small>${s.topicsTaught}/${s.topicsTotal} topics taught${nt?` · <b>${esc(nt.title)}</b> in ${dl}d`:''}${open?` · ${open} open error${open>1?'s':''}`:''}</small><small>Next: ${esc(s.next[0]||'')}</small></div>`; }).join('')}</div>
  <div id="subjDetail"></div>`;
  v.querySelectorAll('[data-s]').forEach(el=>el.addEventListener('click',()=>renderSubjectDetail(el.dataset.s)));
}
function renderSubjectDetail(id){
  const s=(S.subjects?.subjects||[]).find(x=>x.id===id); if(!s) return; const er=S.errors.filter(e=>e.subject===id).sort((a,b)=>a.date<b.date?1:-1).slice(0,8);
  $('#subjDetail').innerHTML=`<div class="g card" style="margin-top:16px;border-top:4px solid ${s.color}"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><div style="font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.025em">${esc(s.name)}</div><span class="muted small">${esc(s.teacherNote||'')}</span></div>
  <h2>Pre-learn queue</h2><ol style="margin:0;padding-left:20px">${s.next.map(n=>`<li style="margin:4px 0">${esc(n)}</li>`).join('')}</ol>
  <h2>Log an error</h2><div class="form"><label>Topic<input id="eTopic" placeholder="e.g. A.2 friction on an incline"></label><label>Type<select id="eType"><option>concept</option><option>method</option><option>algebra slip</option><option>misread</option><option>time</option><option>command term</option></select></label><label class="full">What I did → what the scheme wanted<input id="eWhat" placeholder="I used F = ma along the horizontal; scheme resolves along the incline"></label><label class="full">Fix rule (one sentence)<input id="eFix" placeholder="Always draw axes along and perpendicular to the surface first."></label></div>
  <div class="actions"><button class="btn" id="eSave">Save error</button><span class="muted small">Closes after two spaced correct reattempts.</span></div>
  <h2>Open errors</h2>${er.length?er.map(e=>`<div class="ms ${e.closed?'done':''}" data-e="${e.id}"><span class="ck ${e.closed?'done':''}" style="cursor:pointer"></span><span class="d">${esc(e.date.slice(5))}</span><span class="t"><b>${esc(e.topic)}</b> · ${esc(e.type)} · ${esc(e.fix||e.what||'')}</span><span class="cat">${e.reattempts||0}/2</span></div>`).join(''):'<div class="muted small">No errors logged yet. The first wrong answer goes here.</div>'}
  </div>`;
  $('#eSave').addEventListener('click',async()=>{ const e={ id:'e'+Date.now().toString(36), date:S.date, subject:id, topic:$('#eTopic').value.trim(), type:$('#eType').value, what:$('#eWhat').value.trim(), fix:$('#eFix').value.trim(), reattempts:0, closed:false }; if(!e.topic){ toast('Topic first'); return; } S.errors.unshift(e); if(S.db){ try{ await S.db.doc('errors/'+e.id).set(e); }catch(x){ toast('Not saved'); } } toast('Logged'); renderSubjects(); renderSubjectDetail(id); });
  $('#subjDetail').querySelectorAll('[data-e] .ck').forEach(ck=>ck.addEventListener('click',async()=>{ const e=S.errors.find(x=>x.id===ck.parentElement.dataset.e); e.reattempts=(e.reattempts||0)+1; if(e.reattempts>=2) e.closed=true; if(S.db){ try{ await S.db.doc('errors/'+e.id).set(e);}catch(x){} } renderSubjectDetail(id); }));
  $('#subjDetail').scrollIntoView({behavior:'smooth',block:'start'});
}

// ---------- stanford ----------
function renderStanford(){
  const v=$('#v-stanford'); const st=S.stanford||{}; const ms=(st.milestones||[]); const dl=daysBetween(S.date, st.rea||'2027-11-01');
  const upcoming=ms.filter(m=>!S.stanfordDone[m.id]).slice(0,6); const soon=upcoming.filter(m=>daysBetween(S.date,m.date)<=30);
  v.innerHTML=`<div class="emblem"><div class="seal">S</div><div><h1>Stanford · ${esc(APP.classOf)}</h1><div class="sub">Restrictive Early Action closes in <b>${dl}</b> days · Nov 1, 2027</div></div></div>
  <div class="grid3" style="margin-top:18px"><div class="g card"><div class="cat" style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)">Testing</div><div style="margin-top:6px;font-size:14px">${esc(st.notes?.testing||'')}</div></div><div class="g card"><div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)">Predictions</div><div style="margin-top:6px;font-size:14px">${esc(st.notes?.predictions||'')}</div></div><div class="g card"><div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)">The spike</div><div style="margin-top:6px;font-size:14px">${esc(st.notes?.spike||'')}</div></div></div>
  ${soon.length?`<h2>Due within 30 days</h2><div class="g card">${soon.map(m=>row(m)).join('')}</div>`:''}
  <h2>The track · ${ms.filter(m=>S.stanfordDone[m.id]).length}/${ms.length} done</h2><div class="g card" id="msAll">${ms.map(m=>row(m)).join('')}</div>`;
  function row(m){ const d=daysBetween(S.date,m.date); return `<div class="ms ${S.stanfordDone[m.id]?'done':''}" data-m="${m.id}"><span class="ck ${S.stanfordDone[m.id]?'done':''}" style="cursor:pointer;${S.stanfordDone[m.id]?'background:var(--accent);border-color:var(--accent)':''}"></span><span class="d">${esc(m.date.slice(2))}</span><span class="t">${esc(m.title)}${d<0&&!S.stanfordDone[m.id]?' <span class="pill bad">overdue</span>':''}</span><span class="cat">${esc(m.cat)} · ${esc(m.owner)}</span></div>`; }
  v.querySelectorAll('[data-m] .ck').forEach(ck=>ck.addEventListener('click',async()=>{ const id=ck.parentElement.dataset.m; S.stanfordDone[id]=!S.stanfordDone[id]; if(S.db){ try{ await S.db.doc('stanford/progress').set({done:S.stanfordDone}); }catch(x){ toast('Not saved'); } } renderStanford(); }));
}

// ---------- contract ----------
function renderContract(){
  const v=$('#v-contract'); const c=S.contract||{}; const from=addDays(S.date,-6); const rows=S.week.filter(r=>r.date>=from&&r.date<S.date);
  const misses=rows.reduce((a,r)=>a+Math.max(0,((r.report&&r.report.sprintsPlanned)||0)-((r.report&&r.report.sprintsDone)||0)),0)+rows.filter(r=>!r.report).length;
  v.innerHTML=`<h1>The Contract</h1><div class="sub">You write it. A witness reads it. A small private stake makes it real. It fades on purpose: full scaffold weeks 1–3, misses-only reminders from week 4, self-logged by week 7.</div>
  <div class="grid2" style="margin-top:18px"><div class="g card"><div class="form"><label class="full">Terms, in your words<textarea id="cTerms" style="min-height:140px">${esc(c.terms||'I fly five blocks a week for ten weeks. I report every night before lights out. When a test is announced I tell Claude the same day. I put the phone in another room during every flight.')}</textarea></label><label>Witness<input id="cWitness" value="${esc(c.witness||'')}" placeholder="Who reads the nightly line"></label><label>Stake per missed block<input id="cStake" value="${esc(c.stake||'')}" placeholder="e.g. R$ 20 or 30 min of gaming"></label></div>
  <div class="actions"><button class="btn" id="cSign">${c.signedAt?'Update':'Sign'}</button>${c.signedAt?`<span class="pill ok">Signed ${esc(c.signedAt.slice(0,10))}</span>`:'<span class="muted small">Unsigned. Nothing here counts yet.</span>'}</div></div>
  <div><div class="g card"><div style="font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.02em">Ledger · last 7 days</div><div class="ledger" style="margin-top:10px"><span class="k">Missed blocks</span><b>${misses}</b><span class="k">Unreported days</span><b>${rows.filter(r=>!r.report).length}</b><span class="k">Owed to the stake</span><b>${c.stake?`${misses} × ${esc(c.stake)}`:'—'}</b></div></div>
  <h2>Rules</h2><div class="g card"><ol style="margin:0;padding-left:20px;font-size:14px">${['Sprint 1 is what counts as a day started. Ten minutes is a day started.','Phone leaves the room at every flight. One flight per block.','Pre-learn tomorrow. Class is your first retrieval, not first exposure.','Every wrong answer gets a line: what I did, what the scheme wanted, the fix rule.','Drafts reach the teacher early. Early delivery is how you get feedback.','Hard stop 21:15. Read. Lights out 22:45. Sleep is the frame.'].map(r=>`<li style="margin:6px 0">${r}</li>`).join('')}</ol></div></div></div>`;
  $('#cSign').addEventListener('click',async()=>{ const body={ terms:$('#cTerms').value.trim(), witness:$('#cWitness').value.trim(), stake:$('#cStake').value.trim(), signedAt:(S.contract&&S.contract.signedAt)||new Date().toISOString(), updatedAt:new Date().toISOString() }; S.contract=body; if(S.db){ try{ await S.db.doc('contract/main').set(body); }catch(x){ toast('Not saved'); } } toast('Signed'); renderContract(); });
}

function renderAll(){ renderNav(); document.querySelectorAll('.view').forEach(x=>x.classList.remove('on')); const el=$('#v-'+S.view)||$('#v-deck'); el.classList.add('on'); ({deck:renderDeck,tour:renderTour,subjects:renderSubjects,stanford:renderStanford,contract:renderContract}[S.view]||renderDeck)(); const rf=$('#railfoot'); if(rf) rf.textContent=`${pretty(S.date)} · ${S.db?'synced':'offline'}`; }
renderAll();
setInterval(()=>{ if(S.view==='deck') renderDeck(); }, 60000);

// ---------- db ----------
(async()=>{
  const db = await claude.use('db'); S.dbTried=true; if(!db){ renderAll(); return; } S.db=db;
  try{ const user=await claude.use('user'); if(user){ S.uid=await user.id(); const cw=await user.can('data.write'); S.canWrite=cw; } }catch(e){}
  const sub=(ref, fn)=>ref.onSnapshot(snap=>{ fn(snap); renderAll(); }, err=>console.warn('db', err));
  sub(db.doc('plan/'+S.date), s=>{ if(s.exists) S.plan=s.data(); });
  sub(db.doc('days/'+S.date), s=>{ if(s.exists){ const ex=(S.day&&S.day.expanded)||{}; S.day=Object.assign({},s.data(),{expanded:ex}); } });
  sub(db.doc('audit/'+S.date), s=>{ S.audit=s.exists?s.data():null; });
  for(const k of ['subjects','assessments','tour','stanford']) sub(db.doc('state/'+k), s=>{ if(s.exists) S[k]=s.data(); });
  sub(db.doc('stanford/progress'), s=>{ S.stanfordDone=s.exists?(s.data().done||{}):{}; });
  sub(db.doc('contract/main'), s=>{ S.contract=s.exists?s.data():null; });
  sub(db.collection('errors').orderBy('date','desc').limit(300), s=>{ S.errors=s.docs.map(d=>d.data()); });
  const from=addDays(S.date,-7);
  sub(db.collection('days').where('date','>=',from).limit(14), s=>{ S.week=s.docs.map(d=>d.data()); });
  sub(db.collection('audit').where('date','>=',from).limit(14), s=>{ S.auditWeek=s.docs.map(d=>d.data()); });
})();
</script>
